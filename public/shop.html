<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop · Maati</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
/* ---- Animation layer (sits on top of /style.css) ---- */
:root{--glaze:#1b2550;--celadon:#cfe0d4;--saffron:#e8a33d;--ease:cubic-bezier(.2,.9,.25,1.15)}
body{overflow-x:hidden}
.progress{position:fixed;inset:0 0 auto 0;height:4px;z-index:50;background:var(--saffron);transform-origin:left;transform:scaleX(0)}

/* hero: a pot being thrown on the wheel */
.hero{position:relative;display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:2rem;min-height:88vh;padding:4rem 1.5rem 2rem;max-width:1200px;margin:0 auto}
.hero h1{font-family:"Young Serif",serif;font-size:clamp(3.2rem,10vw,8rem);line-height:.95;margin:0;color:var(--glaze);perspective:600px}
.hero h1 .ch{display:inline-block;transform-origin:50% 100%;opacity:0;transform:translateY(120%) rotateX(-90deg);animation:throw .9s var(--ease) forwards;animation-delay:calc(var(--i)*70ms + 200ms)}
@keyframes throw{to{opacity:1;transform:none}}
.hero p{font-family:Figtree,sans-serif;font-size:1.15rem;max-width:30ch;opacity:0;animation:fade 1s 1.2s forwards}
@keyframes fade{to{opacity:1}}
.wheel{width:100%;max-width:440px;justify-self:center;overflow:visible}
.wheel .spin{stroke-dasharray:14 12;animation:dash 2.4s linear infinite}
@keyframes dash{to{stroke-dashoffset:-104}}
.wheel .bands line{animation:rise 1.2s linear infinite}
@keyframes rise{from{transform:translateY(0)}to{transform:translateY(-24px)}}
.wheel .sway{transform-origin:150px 260px;animation:sway 9s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(1.5deg)}}

/* drifting clay blobs */
.blob{position:fixed;z-index:-1;border-radius:46% 54% 60% 40%/50% 40% 60% 50%;filter:blur(2px);opacity:.55;animation:morph 14s ease-in-out infinite alternate}
.blob.a{width:42vw;height:42vw;background:var(--celadon);left:-12vw;top:10vh}
.blob.b{width:30vw;height:30vw;background:#f3c98b;right:-8vw;top:50vh;animation-delay:-6s}
@keyframes morph{to{border-radius:60% 40% 36% 64%/40% 60% 40% 60%;transform:translate(4vw,6vh) rotate(40deg) scale(1.12)}}

/* marquee */
.marquee{overflow:hidden;white-space:nowrap;background:var(--glaze);color:#fff;font-family:Figtree,sans-serif;padding:.9rem 0;transform:rotate(-1.2deg);margin:2rem -2vw}
.marquee div{display:inline-block;animation:slide 22s linear infinite}
.marquee span{margin:0 2.5rem;font-size:1.05rem}
@keyframes slide{to{transform:translateX(-50%)}}

/* section title + cards */
.wrap h2 .ch{display:inline-block;opacity:0;transform:translateY(60%) rotate(8deg);transition:all .7s var(--ease);transition-delay:calc(var(--i)*40ms)}
.wrap h2.in .ch{opacity:1;transform:none}
.grid>*{opacity:0;transform:translateY(110px) rotate(5deg) scale(.88);clip-path:inset(0 0 100% 0 round 18px);transition:opacity .6s ease,transform 1s var(--ease),clip-path 1s var(--ease);transition-delay:calc(var(--d,0)*110ms);will-change:transform}
.grid>*.in{opacity:1;transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));clip-path:inset(0 0 0 0 round 18px)}
.grid>*.in.tilting{transition:transform .12s linear;transition-delay:0s}
.grid>*.in:hover{filter:drop-shadow(0 22px 28px rgba(27,37,80,.28))}
.grid img{transition:transform 1.1s var(--ease)}
.grid>*:hover img{transform:scale(1.12) rotate(-2deg)}
button{position:relative;overflow:hidden}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.65);transform:scale(0);animation:rip .7s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

@media(max-width:760px){.hero{grid-template-columns:1fr;min-height:auto}.wheel{max-width:280px}}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
 .hero h1 .ch,.hero p,.grid>*,.wrap h2 .ch{opacity:1;transform:none;clip-path:none}
}
</style></head><body>
<div class="progress" id="bar"></div>
<div class="blob a"></div><div class="blob b"></div>

<header class="hero">
  <div>
    <h1 id="title">Maati</h1>
    <p>Hand-thrown ceramics, shaped one turn at a time.</p>
  </div>
  <svg class="wheel" viewBox="0 0 300 320" aria-hidden="true">
    <defs>
      <path id="vessel" fill="#1b2550">
        <animate attributeName="d" dur="9s" repeatCount="indefinite" calcMode="spline"
          keyTimes="0;.35;.7;1" keySplines=".5 0 .3 1;.5 0 .3 1;.5 0 .3 1"
          values="M80 260 C70 215,80 170,110 150 L190 150 C220 170,230 215,220 260 Z;
                  M65 260 C35 220,40 150,60 115 L240 115 C260 150,265 220,235 260 Z;
                  M100 260 C55 205,95 140,122 70 L178 70 C205 140,245 205,200 260 Z;
                  M80 260 C70 215,80 170,110 150 L190 150 C220 170,230 215,220 260 Z"/>
      </path>
      <clipPath id="clip"><use href="#vessel"/></clipPath>
    </defs>
    <ellipse class="spin" cx="150" cy="268" rx="125" ry="22" fill="none" stroke="#e8a33d" stroke-width="3"/>
    <ellipse cx="150" cy="280" rx="125" ry="22" fill="#cfe0d4"/>
    <g class="sway">
      <use href="#vessel"/>
      <g class="bands" clip-path="url(#clip)" stroke="#e8a33d" stroke-width="3" opacity=".9">
        <line x1="0" x2="300" y1="100" y2="100"/><line x1="0" x2="300" y1="124" y2="124"/><line x1="0" x2="300" y1="148" y2="148"/>
        <line x1="0" x2="300" y1="172" y2="172"/><line x1="0" x2="300" y1="196" y2="196"/><line x1="0" x2="300" y1="220" y2="220"/>
        <line x1="0" x2="300" y1="244" y2="244"/><line x1="0" x2="300" y1="268" y2="268"/><line x1="0" x2="300" y1="292" y2="292"/>
      </g>
    </g>
    <ellipse cx="150" cy="262" rx="70" ry="9" fill="#cfe0d4" opacity=".9"/>
  </svg>
</header>

<div class="marquee" aria-hidden="true"><div id="mq"></div></div>

<main class="wrap"><section><h2>All ceramics</h2><p class="sub">Prices in Pakistani rupees. Free delivery over Rs 5,000.</p><div class="grid" id="all"></div></section></main>

<script src="/app.js"></script>
<script>async function init(){const{data}=await api("/api/products");const g=$("#all");g.innerHTML=data.map(card).join("");bindAdd(g)}</script>

<script>
(function(){
  // split text into animated letters
  function split(el){const t=el.textContent;el.setAttribute("aria-label",t);el.innerHTML=[...t].map((c,i)=>'<span class="ch" aria-hidden="true" style="--i:'+i+'">'+(c===" "?"&nbsp;":c)+"</span>").join("")}
  split(document.getElementById("title"));
  const h2=document.querySelector(".wrap h2");split(h2);

  // marquee
  const msg='<span>Free delivery over Rs 5,000</span><span>Made by hand in small batches</span><span>Every piece is one of a kind</span>';
  document.getElementById("mq").innerHTML=msg.repeat(4);

  // reveal on scroll (works for cards rendered later by init())
  const io=new IntersectionObserver(es=>es.forEach(e=>{
    if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}
  }),{threshold:.15});
  io.observe(h2);
  function watch(card,i){card.style.setProperty("--d",i%4);io.observe(card);
    card.addEventListener("pointermove",e=>{const r=card.getBoundingClientRect();
      card.classList.add("tilting");
      card.style.setProperty("--ry",((e.clientX-r.left)/r.width-.5)*14+"deg");
      card.style.setProperty("--rx",(.5-(e.clientY-r.top)/r.height)*14+"deg")});
    card.addEventListener("pointerleave",()=>{card.classList.remove("tilting");card.style.setProperty("--rx","0deg");card.style.setProperty("--ry","0deg")});
  }
  const grid=document.getElementById("all");
  new MutationObserver(()=>{[...grid.children].forEach((c,i)=>{if(!c._w){c._w=1;watch(c,i)}})}).observe(grid,{childList:true});

  // scroll progress + parallax
  const bar=document.getElementById("bar"),a=document.querySelector(".blob.a"),b=document.querySelector(".blob.b");
  let tick=false;
  addEventListener("scroll",()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{
    const y=scrollY,max=document.documentElement.scrollHeight-innerHeight;
    bar.style.transform="scaleX("+(max>0?y/max:0)+")";
    a.style.translate="0 "+(y*.18)+"px";b.style.translate="0 "+(-y*.12)+"px";tick=false})},{passive:true});

  // ripple on buttons
  document.addEventListener("click",e=>{const btn=e.target.closest("button");if(!btn)return;
    const r=btn.getBoundingClientRect(),s=Math.max(r.width,r.height),d=document.createElement("span");
    d.className="ripple";d.style.cssText="width:"+s+"px;height:"+s+"px;left:"+(e.clientX-r.left-s/2)+"px;top:"+(e.clientY-r.top-s/2)+"px";
    btn.appendChild(d);setTimeout(()=>d.remove(),700)});
})();
</script></body></html>
