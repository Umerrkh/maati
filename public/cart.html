<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your Cart · Maati</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<style>
:root{--ease:cubic-bezier(.22,.8,.24,1);--green:#2e7d32}

/* animated background blobs */
.bg{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.35}
.bg i:nth-child(1){width:340px;height:340px;background:#ffd9a8;top:-80px;left:-60px;animation:drift 16s ease-in-out infinite alternate}
.bg i:nth-child(2){width:300px;height:300px;background:#bfe3c0;bottom:-60px;right:-40px;animation:drift 20s ease-in-out infinite alternate-reverse}
.bg i:nth-child(3){width:240px;height:240px;background:#f6c1c1;top:45%;left:55%;animation:drift 24s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(60px,-50px) scale(1.2)}}

/* entrance */
.wrap h2,.wrap section>p{animation:rise .8s var(--ease) both}
.wrap section>p{animation-delay:.08s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.wrap h2 .cico{display:inline-block;transform-origin:70% 80%;animation:wobble 2.8s ease-in-out 1s infinite}
@keyframes wobble{0%,60%,100%{transform:rotate(0)}10%{transform:rotate(-14deg)}20%{transform:rotate(12deg)}30%{transform:rotate(-8deg)}40%{transform:rotate(5deg)}}
.promo{background:linear-gradient(100deg,#2e7d32 30%,#8bd18f 50%,#2e7d32 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:rise .8s var(--ease) .08s both,shimmer 3.5s linear infinite}
@keyframes shimmer{to{background-position:-220% 0}}

/* free delivery progress */
.ship{margin:0 0 16px;animation:rise .8s var(--ease) .12s both}
.shipbar{height:8px;border-radius:99px;background:rgba(0,0,0,.08);overflow:hidden}
.shipbar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#66bb6a,#2e7d32);transition:width .9s var(--ease);position:relative}
.shipbar i::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.55) 50%,transparent 70%);transform:translateX(-100%);animation:sweep 2.2s ease-in-out infinite}
.ship.ok .shipbar i{box-shadow:0 0 12px rgba(46,125,50,.7)}
.ship small{display:block;margin-top:6px;font-size:13px;color:#555;transition:color .3s}
.ship.ok small{color:var(--green);font-weight:600;animation:pop .6s var(--ease)}
@keyframes sweep{to{transform:translateX(100%)}}
@keyframes pop{40%{transform:scale(1.06)}}

/* items */
.cartlist.enter .item{animation:rise .8s var(--ease) both;animation-delay:calc(.18s + var(--n)*110ms)}
.cartlist.enter .item .pic{animation:settle 1.1s var(--ease) both;animation-delay:calc(.25s + var(--n)*110ms)}
@keyframes settle{from{transform:scale(.88);opacity:0}to{transform:none;opacity:1}}
.cartlist.enter~.total{animation:rise .8s var(--ease) both;animation-delay:.74s}

.item{position:relative;overflow:hidden;transition:height .42s var(--ease),opacity .3s ease,transform .42s var(--ease),padding .42s var(--ease),margin .42s var(--ease),translate .35s var(--ease),box-shadow .35s ease}
.item:hover{translate:0 -3px;box-shadow:0 10px 24px rgba(0,0,0,.1)}
.item::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.5),transparent);transform:skewX(-20deg);transition:left .7s var(--ease);pointer-events:none}
.item:hover::after{left:130%}
.item .pic{transition:scale .4s var(--ease),rotate .4s var(--ease)}
.item:hover .pic{scale:1.08;rotate:-3deg}
.item.leaving{height:0!important;opacity:0;transform:translateX(28px);padding-top:0;padding-bottom:0;margin-top:0;margin-bottom:0;overflow:hidden}

/* qty + prices */
.qty button{transition:transform .18s var(--ease),background-color .25s ease}
.qty button:hover{transform:scale(1.12)}
.qty button:active{transform:scale(.82)}
.qty span{display:inline-block;min-width:1.5em;text-align:center}
.qty span.bump{animation:bump .35s var(--ease)}
@keyframes bump{40%{transform:translateY(-3px) scale(1.3)}}
.lt.flash{animation:flash .6s ease}
@keyframes flash{30%{color:var(--green);transform:scale(1.12)}}
.total span,.item b{font-variant-numeric:tabular-nums}

/* buttons */
.btn{position:relative;overflow:hidden;transition:translate .25s var(--ease),scale .2s var(--ease),box-shadow .3s ease,filter .3s ease}
.btn:hover{translate:0 -2px;box-shadow:0 8px 20px rgba(0,0,0,.14)}
.btn:active{translate:0 0;scale:.96;box-shadow:none}
#buy{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(46,125,50,.35)}50%{box-shadow:0 0 0 10px rgba(46,125,50,0)}}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple .6s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(3);opacity:0}}

/* order placed */
#box{transition:opacity .35s ease,transform .35s var(--ease)}
#box.out{opacity:0;transform:translateY(-10px)}
.done .tick{display:block;margin:0 auto 12px}
.done .tick circle,.done .tick path{fill:none;stroke:#2e7d32;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.done .tick circle{stroke-dasharray:152;stroke-dashoffset:152;animation:stroke .8s var(--ease) forwards}
.done .tick path{stroke-dasharray:40;stroke-dashoffset:40;animation:stroke .5s var(--ease) .55s forwards}
.done .tick{animation:tickpop .6s var(--ease) 1.05s}
@keyframes tickpop{40%{transform:scale(1.18)}}
@keyframes stroke{to{stroke-dashoffset:0}}
.done h3,.done p,.done .btn{animation:rise .8s var(--ease) both}
.done h3{animation-delay:.7s}.done p{animation-delay:.85s}.done .btn{animation-delay:1s}

/* empty */
.empty:not(.done){animation:rise .8s var(--ease) both}
.empty .ebig{font-size:54px;display:block;animation:bounce 2s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style></head><body>
<div class="bg"><i></i><i></i><i></i></div>
<main class="wrap"><section><h2>Your cart <span class="cico">🛒</span></h2><p class="promo" style="font-size:14px;margin:0 0 12px">Free delivery on orders over $50 (CI/CD test)</p><div id="box"></div></section></main>
<script src="/app.js"></script><script>let P=[],shown=0,first=true;const FREE=50;
async function init(){P=(await api("/api/products")).data;draw();$("#box").onclick=click}
const money=()=>{const c=cart.get();return Object.keys(c).reduce((t,i)=>{const p=P.find(x=>x.id==i);return t+(p?p.price*c[i]:0)},0)};
function tween(el,to){if(!el)return;const from=shown,t0=performance.now(),D=450;shown=to;cancelAnimationFrame(el._r);
(function f(n){const k=Math.min(1,(n-t0)/D),e=1-Math.pow(1-k,3);el.textContent="Total "+fmt(from+(to-from)*e);if(k<1)el._r=requestAnimationFrame(f)})(t0)}
function ship(t){const s=$("#ship");if(!s)return;const ok=t>=FREE;s.classList.toggle("ok",ok);
$("#shipfill").style.width=Math.min(100,t/FREE*100)+"%";
$("#shiptxt").textContent=ok?"🎉 You unlocked free delivery!":"Add "+fmt(FREE-t)+" more for free delivery"}
function confetti(){const cols=["#2e7d32","#ffb74d","#e57373","#64b5f6","#ba68c8","#fff176"];
for(let i=0;i<56;i++){const e=document.createElement("i");const s=6+Math.random()*7;
e.style.cssText=`position:fixed;left:50%;top:42%;width:${s}px;height:${s*1.4}px;background:${cols[i%6]};border-radius:2px;pointer-events:none;z-index:99`;
document.body.appendChild(e);const a=Math.random()*Math.PI*2,d=120+Math.random()*260;
e.animate([{transform:"translate(0,0) rotate(0)",opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d+180}px) rotate(${Math.random()*720}deg)`,opacity:0}],{duration:1400+Math.random()*900,easing:"cubic-bezier(.15,.7,.3,1)"}).onfinish=()=>e.remove()}}
document.addEventListener("click",e=>{const b=e.target.closest(".btn");if(!b)return;const r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement("span");
s.className="rip";s.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(s);setTimeout(()=>s.remove(),650)});
function draw(){const c=cart.get(),ids=Object.keys(c).filter(i=>c[i]>0),b=$("#box");
if(!ids.length){b.innerHTML=`<div class="empty"><span class="ebig">🛒</span><p>Your cart is empty.</p><a class="btn" href="/shop.html">Browse the shop</a></div>`;return}
let t=0;b.innerHTML=`<div class="ship" id="ship"><div class="shipbar"><i id="shipfill"></i></div><small id="shiptxt"></small></div><div class="cartlist${first?" enter":""}">`+ids.map((i,n)=>{const p=P.find(x=>x.id==i);t+=p.price*c[i];
return `<div class="item" data-row="${i}" style="--c:${p.color};--n:${n}"><div class="pic"></div><div><b>${p.name}</b><br><small>${fmt(p.price)}</small></div>
<div class="qty"><button data-d="-1" data-i="${i}" aria-label="Fewer">−</button><span data-q>${c[i]}</span><button data-d="1" data-i="${i}" aria-label="More">+</button></div><b class="lt">${fmt(p.price*c[i])}</b></div>`}).join("")+
`</div><div class="total"><span id="tot">Total ${fmt(t)}</span><button class="btn" id="buy">Place order</button></div><p class="msg" id="m"></p>`;
shown=t;first=false;requestAnimationFrame(()=>requestAnimationFrame(()=>ship(t)))}
function click(e){const b=$("#box"),btn=e.target.closest("button[data-i]");
if(btn){const i=btn.dataset.i,c=cart.get();c[i]=Math.max(0,c[i]+ +btn.dataset.d);cart.set(c);
const row=b.querySelector(`[data-row="${i}"]`),p=P.find(x=>x.id==i);
if(c[i]===0){row.style.height=row.offsetHeight+"px";void row.offsetHeight;row.classList.add("leaving");tween($("#tot"),money());ship(money());setTimeout(draw,440)}
else{const q=row.querySelector("[data-q]");q.textContent=c[i];q.classList.remove("bump");void q.offsetWidth;q.classList.add("bump");
const lt=row.querySelector(".lt");lt.textContent=fmt(p.price*c[i]);lt.classList.remove("flash");void lt.offsetWidth;lt.classList.add("flash");
tween($("#tot"),money());ship(money())}
return}
if(e.target.id==="buy"){if(!user){location.href="/auth.html?next=cart";return}cart.set({});b.classList.add("out");
setTimeout(()=>{b.innerHTML=`<div class="empty done"><svg class="tick" viewBox="0 0 52 52" width="64" height="64" aria-hidden="true"><circle cx="26" cy="26" r="24"/><path d="M15 27l8 8 14-16"/></svg><h3>Order placed, ${user.name.split(" ")[0]}.</h3><p>Thank you. We will email you when it ships.</p><a class="btn" href="/shop.html">Keep shopping</a></div>`;b.classList.remove("out");confetti()},360)}}</script></body></html>
