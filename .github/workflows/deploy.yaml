name: Nodejs CI/CD
on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOSTS }}
          username: root
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /root/maati
            git pull origin main
            docker compose up -d --build