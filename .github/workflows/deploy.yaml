name: Maati CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      
      - name: Deploy Maati
        run: |
          cd /opt/maati
          pwd
          docker compose config
          docker compose up -d --build


