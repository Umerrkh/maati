name: Nodejs CI/CD

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check deployment environment
        run: |
          whoami
          pwd
          ls -la
          docker ps
          docker compose version

      - name: Build and deploy
        run: docker compose up -d --build


      #- name: Clean up old images
        #run: docker image prune -f
