name: Maati CI/CD

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      
      - name: Deploy Maati
        run: |
          cd /opt/maati
          echo "=== Current directory ==="
          pwd
          echo "=== Compose configuration ==="
          docker compose config
          echo "=== Deploying ==="
          docker compose up -d --build --force-recreate
          docker compose ps


