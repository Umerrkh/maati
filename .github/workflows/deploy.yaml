name: Nodejs CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Build and deploy with Docker Compose
        run: docker compose up -d --build

      - name: Clean up old images
        run: docker image prune -f
